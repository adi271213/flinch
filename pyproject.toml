[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-flinch"
version = "0.1.0"
description = "Reference-free numerical processor and chronology auditing for LeRobot checkpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.31,<3.0",
    "lerobot>=0.7.0",
    "numpy>=2.0",
    "safetensors>=0.4.3",
    "torch>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1.2", "mypy==2.4.1", "ruff==0.17.5", "twine>=6"]

[project.urls]
Repository = "https://github.com/adi271213/flinch"
Issues = "https://github.com/adi271213/flinch/issues"

[project.scripts]
flinch = "lerobot_flinch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/lerobot_flinch"]
python_version = "3.12"
strict = true
no_site_packages = true
follow_imports = "skip"
ignore_missing_imports = true
