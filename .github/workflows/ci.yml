name: Clean distribution checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"
  PYTHONNOUSERSITE: "1"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  build:
    name: Build wheel and sdist once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine mypy==2.4.1 ruff==0.17.5

      - name: Check Python source and import hygiene
        run: python -m ruff check src scripts tests examples

      - name: Check Python formatting
        run: python -m ruff format --check src scripts tests examples

      - name: Check strict project types
        run: python -m mypy

      - name: Build isolated distributions
        run: python -m build --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Record exact artifact hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          artifacts = sorted(root.glob("*.whl")) + sorted(root.glob("*.tar.gz"))
          assert len(artifacts) == 2, "Exactly one wheel and one source archive are required"
          hashes = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in artifacts}
          (root / "artifact_hashes.json").write_text(json.dumps(hashes, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(hashes, indent=2))
          PY

      - name: Share the same distributions with every platform
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/artifact_hashes.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Python 3.12 / ${{ matrix.os }} / ${{ matrix.distribution }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        distribution: [wheel, sdist]
        include:
          # Request CPU wheels through PyTorch's official CPU index rather than
          # requiring CUDA for numeric probes. Pip still resolves all dependencies.
          - os: ubuntu-latest
            torch_cpu: --torch-cpu
          - os: windows-latest
            torch_cpu: --torch-cpu
          - os: macos-latest
            torch_cpu: ""
    steps:
      - name: Check out the test harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the exact built distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-distributions
          path: dist

      - name: Clean install, native CLI and full source-archive pytest
        # The Python harness creates a new platform-native venv, removes
        # PYTHONPATH and never activates or imports the checkout's environment.
        # Runtime-only CLI smoke tests run before pytest is installed.
        run: >-
          python scripts/ci_release_check.py
          --distribution "${{ matrix.distribution }}"
          --dist-dir "dist"
          --work-dir "${{ runner.temp }}/preflight release check spaces/${{ matrix.distribution }}"
          --results-dir "ci-results"
          ${{ matrix.torch_cpu }}

      - name: Preserve logs, diagnostic reports and JUnit even on failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: checks-${{ matrix.os }}-python312-${{ matrix.distribution }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14
