name: Weekly Hub scan

# Re-audits public LeRobot checkpoints on the Hugging Face Hub every week and keeps the
# reports as a downloadable artifact. Only small files and byte ranges are fetched; model
# weights are never downloaded.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of repositories to scan (1-100)"
        default: "100"

permissions:
  contents: read

concurrency:
  group: hub-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Flinch with CPU-only PyTorch
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu .

      - name: Scan the Hub
        env:
          LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: >-
          python scripts/scan_hub.py --targeted --limit "$LIMIT"
          --output-dir hub-audit --report-name "hub_scan_$(date -u +%Y-%m-%d)"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hub-scan-${{ github.run_id }}
          path: hub-audit/
          if-no-files-found: warn
          retention-days: 90
